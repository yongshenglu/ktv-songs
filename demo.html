<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>歌名排版对比 Demo</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <style>
      :root {
        --bg: #0b0e14;
        --surface: #161c27;
        --surface-2: #1c2431;
        --border-soft: #1e2733;
        --text: #eaeff7;
        --text-2: #a3b0c2;
        --text-3: #6f7c8f;
        --accent: #f5b942;
        --accent-soft: rgba(245, 185, 66, 0.14);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: anywhere;
      }

      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(11, 14, 20, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-soft);
        padding: 12px 14px;
        padding-top: calc(12px + env(safe-area-inset-top));
      }
      .top-inner {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 3px;
        font-size: 16px;
        font-weight: 700;
      }
      .note {
        margin: 0 0 11px;
        font-size: 12px;
        color: var(--text-3);
        line-height: 1.5;
      }

      .switch {
        display: flex;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        padding: 4px;
      }
      .switch button {
        flex: 1 1 0;
        min-height: 40px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-2);
        font: inherit;
        font-size: 13.5px;
        font-weight: 650;
        cursor: pointer;
      }
      .switch button[aria-selected="true"] {
        background: var(--accent);
        color: #201704;
      }

      .meter {
        display: flex;
        gap: 8px;
        margin-top: 9px;
        font-size: 11.5px;
        color: var(--text-3);
      }
      .meter b {
        color: var(--accent);
        font-weight: 700;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 12px 14px calc(40px + env(safe-area-inset-bottom));
      }

      .artist {
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        padding: 8px 12px 9px;
        margin-bottom: 8px;
      }
      .artist-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 3px;
      }
      .artist-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
      }
      .artist-count {
        font-size: 11.5px;
        color: var(--text-3);
      }

      /* ── A 内联流式 ── */
      .songs-inline {
        font-size: 15px;
        line-height: 1.9;
        letter-spacing: 0.01em;
      }
      .songs-inline .sep {
        color: var(--text-3);
        margin: 0 0.42em;
      }

      /* ── B 多列网格 ── */
      .songs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
      }
      .songs-grid > div {
        font-size: 15px;
        line-height: 1.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── C 标签胶囊 ── */
      .songs-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .songs-chips .chip {
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        font-size: 14px;
        line-height: 1.55;
      }

      /* ── 对照：现在的一行一首 ── */
      .songs-lines {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .songs-lines li {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 11px 2px;
        border-top: 1px solid var(--border-soft);
        font-size: 16px;
        line-height: 1.45;
      }
      .songs-lines .idx {
        flex: none;
        width: 22px;
        font-size: 11.5px;
        color: var(--text-3);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <h1>歌名排版对比</h1>
        <p class="note">
          用真实歌单渲染，全部展开。选好告诉我，我再做成正式功能。
        </p>
        <div class="switch" role="tablist">
          <button role="tab" data-style="current" aria-selected="false">现在<br />一行一首</button>
          <button role="tab" data-style="inline" aria-selected="true">A 内联<br />流式</button>
          <button role="tab" data-style="grid" aria-selected="false">B 多列<br />网格</button>
          <button role="tab" data-style="chips" aria-selected="false">C 标签<br />胶囊</button>
        </div>
        <div class="meter" id="meter"></div>
      </div>
    </header>

    <main id="app">加载中…</main>

    <script type="module">
      import { groupByArtist } from "./assets/common.js";

      const app = document.getElementById("app");
      const meter = document.getElementById("meter");
      let groups = [];

      function render(style) {
        app.innerHTML = "";
        for (const g of groups) {
          const box = document.createElement("div");
          box.className = "artist";

          const head = document.createElement("div");
          head.className = "artist-head";
          head.innerHTML = `<span class="artist-name"></span><span class="artist-count"></span>`;
          head.querySelector(".artist-name").textContent = g.artist;
          head.querySelector(".artist-count").textContent = `${g.songs.length} 首`;
          box.appendChild(head);

          let body;

          if (style === "current") {
            body = document.createElement("ul");
            body.className = "songs-lines";
            g.songs.forEach((s, i) => {
              const li = document.createElement("li");
              li.innerHTML = `<span class="idx"></span><span></span>`;
              li.querySelector(".idx").textContent = String(i + 1);
              li.lastElementChild.textContent = s.title;
              body.appendChild(li);
            });
          } else if (style === "inline") {
            body = document.createElement("div");
            body.className = "songs-inline";
            g.songs.forEach((s, i) => {
              if (i) {
                const sep = document.createElement("span");
                sep.className = "sep";
                sep.textContent = "·";
                body.appendChild(sep);
              }
              body.appendChild(document.createTextNode(s.title));
            });
          } else if (style === "grid") {
            body = document.createElement("div");
            body.className = "songs-grid";
            for (const s of g.songs) {
              const cell = document.createElement("div");
              cell.textContent = s.title;
              body.appendChild(cell);
            }
          } else {
            body = document.createElement("div");
            body.className = "songs-chips";
            for (const s of g.songs) {
              const chip = document.createElement("span");
              chip.className = "chip";
              chip.textContent = s.title;
              body.appendChild(chip);
            }
          }

          box.appendChild(body);
          app.appendChild(box);
        }
        measure();
      }

      /** 量出整表高度，折算成几屏、一屏能看到多少首 */
      function measure() {
        const totalSongs = groups.reduce((a, g) => a + g.songs.length, 0);
        const listH = app.getBoundingClientRect().height;
        const screenH = window.innerHeight || 812;
        const perScreen = Math.round((totalSongs * screenH) / listH);
        meter.innerHTML =
          `整表 <b>${Math.round(listH)}px</b> ≈ <b>${(listH / screenH).toFixed(1)}</b> 屏` +
          `　·　一屏约 <b>${perScreen}</b> 首` +
          `　·　共 ${totalSongs} 首`;
      }

      document.querySelectorAll(".switch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".switch button")
            .forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
          render(btn.dataset.style);
        });
      });

      const res = await fetch("./data/songs.json?t=" + Date.now());
      const data = await res.json();
      groups = groupByArtist(data.songs);
      render("inline");
      window.addEventListener("resize", measure);
    </script>
  </body>
</html>
